# Yes Cal — LINE calorie tracker bot (Cloudflare Worker + D1 + static dashboard)
name = "yes-cal"
main = "src/index.js"
compatibility_date = "2026-08-01"

# dashboard (หน้าเว็บสถิติ) เสิร์ฟจากโฟลเดอร์ public/
[assets]
directory = "public"

[[d1_databases]]
binding = "DB"
database_name = "yes-cal"
database_id = "5d804c8a-a4ed-4a12-a2cc-93df2b3d5953"

# push สรุปประจำวัน 21:00 เวลาไทย (= 14:00 UTC)
[triggers]
crons = ["0 14 * * *"]

[vars]
# free tier จำกัดโควตาต่อรุ่นต่อวัน (2.5-flash = 20 ครั้ง/วัน) — flash-lite โควตาสูงกว่ามาก
# ถ้ารุ่นหลักเต็ม บอทจะสลับไปรุ่นสำรองให้เองอัตโนมัติ
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_FALLBACK_MODEL = "gemini-2.5-flash"

# Secrets (ตั้งด้วย: npx wrangler secret put <NAME>)
#   LINE_CHANNEL_SECRET        - จาก LINE Developers > Messaging API channel > Basic settings
#   LINE_CHANNEL_ACCESS_TOKEN  - จาก Messaging API tab > Channel access token (long-lived)
#   GEMINI_API_KEY             - จาก https://aistudio.google.com/apikey
#   DASHBOARD_KEY              - รหัสอะไรก็ได้ ไว้กันคนอื่นเปิดหน้า dashboard (ไม่ตั้ง = เปิดได้ทุกคน)
