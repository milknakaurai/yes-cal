# เทส + deploy อัตโนมัติทุกครั้งที่ push ขึ้น branch นี้
#
# การ deploy มีสองทางให้เลือก (เปิดทางเดียวพอ):
#   ทาง A (แนะนำ) — Cloudflare Workers Builds: เชื่อม repo ในหน้าเว็บ Cloudflare
#     (Workers & Pages → yes-cal → Settings → Builds → Connect) ไม่ต้องตั้ง secret ที่ GitHub เลย
#     ไฟล์นี้จะทำหน้าที่เป็นด่านเทสอย่างเดียว (ขั้น deploy ข้ามให้เองเพราะไม่มี token)
#   ทาง B — ตั้ง repository secret ชื่อ CLOUDFLARE_API_TOKEN ที่
#     GitHub → Settings → Secrets and variables → Actions → แท็บ Secrets
#     แล้วไฟล์นี้จะ deploy ให้หลังเทสผ่าน
#
# (secret ของบอทเอง — LINE / Gemini / นาฬิกา — อยู่บน Worker แล้ว คนละที่กัน ไม่ต้องยุ่ง)
name: Test and deploy

on:
  push:
    branches: [claude/line-calorie-tracker-jmgcyz]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci || npm install

      # กันของพังขึ้นกลุ่ม — เทสไม่ผ่านคือไม่ deploy (ทางไหนก็ตาม)
      - name: Run end-to-end tests
        run: node scripts/e2e-test.mjs

      # มี CLOUDFLARE_API_TOKEN ไหม → ตัดสินว่าจะ deploy จากตรงนี้หรือปล่อยให้ Workers Builds ทำ
      - name: Check for Cloudflare token
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### เทสผ่าน แต่ workflow นี้ไม่ได้ deploy"
              echo "ไม่มี secret CLOUDFLARE_API_TOKEN — ถ้าเชื่อม Cloudflare Workers Builds ไว้แล้ว"
              echo "ฝั่ง Cloudflare จะ deploy ให้เองจาก push เดียวกันนี้ ไม่ต้องทำอะไรเพิ่ม"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: cloudflare/wrangler-action@v3
        if: steps.cf.outputs.present == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
